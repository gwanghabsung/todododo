<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>TO-do</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/[email protected]/dist/web/variable/pretendardvariable.css" />
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
/* tokens */
:root {
  --bg-0: #0a0a0c;
  --bg-1: #131318;
  --bg-2: #1c1c23;
  --bg-3: #25252e;
  --border: #2e2e38;
  --border-strong: #3d3d4a;
  --text-0: #f0f0f4;
  --text-1: #c0c0ca;
  --text-2: #7a7a84;
  --text-3: #4d4d56;
  --accent: #f5a524;
  --accent-dim: #a3711a;
  --accent-fade: rgba(245, 165, 36, 0.12);
  --success: #4ade80;
  --danger: #f87171;
  --info: #60a5fa;
  --font-sans: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', monospace;
  --radius: 6px;
  --radius-sm: 4px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg-0); color: var(--text-0); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
body {
  min-height: 100vh;
  background:
    radial-gradient(ellipse 80% 50% at 50% 0%, rgba(245,165,36,0.04), transparent 70%),
    var(--bg-0);
}
button { font-family: inherit; color: inherit; background: none; border: none; cursor: pointer; }
input, textarea { font-family: inherit; color: inherit; background: none; border: none; outline: none; }
input::placeholder { color: var(--text-3); }
.mono { font-family: var(--font-mono); }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--border-strong); }

#app { max-width: 880px; margin: 0 auto; padding: 0 20px 80px; }

/* topbar */
.topbar { padding: 28px 0 20px; border-bottom: 1px solid var(--border); }
.topbar-row {
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px; margin-bottom: 24px;
}
.brand { display: flex; align-items: center; gap: 14px; }
.brand-mark {
  width: 36px; height: 36px;
  border: 1.5px solid var(--accent);
  color: var(--accent);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-mono);
  font-size: 16px; font-weight: 700;
}
.brand-text { line-height: 1; }
.brand-title { font-family: var(--font-mono); font-size: 22px; font-weight: 700; letter-spacing: -0.04em; }
.brand-sub {
  font-family: var(--font-mono); font-size: 10px; color: var(--text-2);
  letter-spacing: 0.1em; margin-top: 4px; text-transform: uppercase;
  transition: color 0.2s;
}
.brand-sub.sync { color: var(--info); }
.brand-sub.pending { color: var(--accent); }
.brand-sub.error { color: var(--danger); }

/* auth */
.auth-area { display: flex; align-items: center; gap: 8px; }
.signin-btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 8px 14px;
  background: var(--bg-1);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-1);
  font-size: 13px;
  transition: all 0.15s;
}
.signin-btn:hover { color: var(--accent); border-color: var(--accent-dim); background: var(--accent-fade); }
.signin-btn::before {
  content: ''; width: 14px; height: 14px;
  background: url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpath fill='%23FFC107' d='M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34.2 6.1 29.4 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z'/%3E%3Cpath fill='%23FF3D00' d='M6.3 14.7l6.6 4.8C14.7 16 19 13 24 13c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34.2 6.1 29.4 4 24 4 16.3 4 9.7 8.3 6.3 14.7z'/%3E%3Cpath fill='%234CAF50' d='M24 44c5.2 0 10-2 13.6-5.3l-6.3-5.2c-2 1.5-4.5 2.5-7.3 2.5-5.2 0-9.6-3.3-11.2-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z'/%3E%3Cpath fill='%231976D2' d='M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.1 5.5l6.3 5.2C41.4 36 44 30.5 44 24c0-1.3-.1-2.4-.4-3.5z'/%3E%3C/svg%3E") no-repeat center / contain;
}
.me { display: inline-flex; align-items: center; gap: 8px; padding: 6px 10px 6px 6px;
  background: var(--bg-1); border: 1px solid var(--border); border-radius: 100px; }
.me-pic { width: 24px; height: 24px; border-radius: 50%; }
.me-name {
  font-family: var(--font-mono); font-size: 12px; color: var(--text-1);
  max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.me-logout {
  width: 18px; height: 18px; border-radius: 50%;
  color: var(--text-3); font-size: 13px; line-height: 1;
  display: inline-flex; align-items: center; justify-content: center;
  margin-left: 2px;
  transition: all 0.15s;
}
.me-logout:hover { color: var(--danger); background: rgba(248,113,113,0.12); }

/* user tabs */
.user-tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.user-tabs::-webkit-scrollbar { display: none; }
.user-tab {
  padding: 8px 16px;
  font-size: 14px; font-weight: 500;
  color: var(--text-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  white-space: nowrap;
  transition: all 0.15s;
  position: relative;
}
.user-tab:hover { color: var(--text-1); border-color: var(--border-strong); }
.user-tab.active { color: var(--accent); border-color: var(--accent); background: var(--accent-fade); }
.user-tab.is-me::after {
  content: ''; position: absolute;
  top: 5px; right: 5px;
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--info);
}
.user-tab-claim {
  padding: 8px 12px;
  color: var(--info);
  border: 1px dashed var(--info);
  font-size: 13px;
  background: rgba(96,165,250,0.05);
}
.user-tab-claim:hover { background: rgba(96,165,250,0.12); }

/* view nav */
.view-nav { display: flex; margin-top: 20px; border-bottom: 1px solid var(--border); }
.view-tab {
  display: flex; align-items: baseline; gap: 8px;
  padding: 14px 22px;
  color: var(--text-2);
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  transition: all 0.15s;
}
.view-tab:hover { color: var(--text-1); }
.view-tab.active { color: var(--text-0); border-bottom-color: var(--accent); }
.view-tab-num { font-family: var(--font-mono); font-size: 11px; color: var(--text-3); }
.view-tab.active .view-tab-num { color: var(--accent); }
.view-tab-label { font-size: 14px; font-weight: 500; }

.content { padding: 28px 0; }
.view { display: none; }
.view.active { display: block; }

/* readonly banner */
.ro-banner {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 16px;
  background: var(--bg-1);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text-2);
  font-size: 13px;
  margin-bottom: 20px;
}
.ro-banner::before {
  content: '👁'; font-size: 14px;
}
.ro-banner.signin-needed {
  border-color: var(--info);
  background: rgba(96,165,250,0.06);
  color: var(--text-1);
}

/* sections */
.section-label {
  font-family: var(--font-mono); font-size: 12px; color: var(--text-2);
  text-transform: uppercase; letter-spacing: 0.12em;
  margin-bottom: 10px;
  display: flex; align-items: center; gap: 8px;
}
.section-label::before { content: ''; width: 4px; height: 4px; background: var(--accent); }
.section-label.muted::before { background: var(--text-3); }

.todo-section + .todo-section { margin-top: 36px; }

.add-todo { display: flex; gap: 8px; margin-bottom: 16px; }
.add-todo input {
  flex: 1;
  padding: 13px 16px;
  background: var(--bg-1);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 15px;
  transition: border-color 0.15s;
}
.add-todo input:focus { border-color: var(--accent); }
.add-todo button {
  padding: 0 20px;
  background: var(--accent);
  color: var(--bg-0);
  font-weight: 600; font-size: 14px;
  border-radius: var(--radius);
  transition: background 0.15s;
}
.add-todo button:hover { background: #ffb52d; }
.add-todo.subtle button { background: var(--bg-2); color: var(--text-1); border: 1px solid var(--border); }
.add-todo.subtle button:hover { color: var(--text-0); border-color: var(--border-strong); background: var(--bg-3); }

.shortcuts-section { margin-bottom: 28px; }
.shortcuts { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px;
  background: var(--bg-1);
  border: 1px solid var(--border);
  border-radius: 100px;
  font-size: 13px;
  color: var(--text-1);
  cursor: pointer;
  transition: all 0.15s;
}
.chip:hover { border-color: var(--accent-dim); background: var(--accent-fade); color: var(--text-0); }
.chip-x {
  display: inline-flex; align-items: center; justify-content: center;
  width: 14px; height: 14px;
  border-radius: 100px;
  color: var(--text-3); font-size: 13px; line-height: 1;
  margin-left: 2px; margin-right: -4px;
  transition: all 0.15s;
}
.chip-x:hover { color: var(--danger); background: rgba(248,113,113,0.12); }
.chip-add {
  padding: 6px 12px; background: transparent;
  border: 1px dashed var(--border); color: var(--text-2);
  font-family: var(--font-mono); font-size: 12px;
}
.chip-add:hover { color: var(--accent); border-color: var(--accent-dim); }

/* todo list */
.todos { display: flex; flex-direction: column; gap: 6px; }
.todo-item {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 14px 14px 16px;
  background: var(--bg-1);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  transition: all 0.15s;
  cursor: grab;
}
.todo-item:hover { border-color: var(--border-strong); background: var(--bg-2); }
.todo-item.dragging { opacity: 0.4; cursor: grabbing; }
.todo-item.drag-over { border-color: var(--accent); }
.todo-item.backlog { background: transparent; }
.todo-item.backlog:hover { background: var(--bg-1); }

.todo-grip { color: var(--text-3); font-size: 12px; letter-spacing: -1px; user-select: none; flex-shrink: 0; }
.todo-check {
  flex-shrink: 0;
  width: 20px; height: 20px;
  border: 1.5px solid var(--border-strong);
  border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
  color: var(--bg-0);
  font-size: 13px;
  font-weight: 700;
  line-height: 1;
}
.todo-check:hover { border-color: var(--accent); }
.todo-check.checked {
  background: var(--accent);
  border-color: var(--accent);
  animation: check-pop 0.25s ease;
}
.todo-check.checked:hover { background: var(--accent); border-color: var(--accent); }
@keyframes check-pop {
  0% { transform: scale(0.7); }
  60% { transform: scale(1.15); }
  100% { transform: scale(1); }
}
.todo-text { flex: 1; font-size: 15px; color: var(--text-0); word-break: break-word; transition: color 0.2s; }

/* 완료된 todo (오늘 완료 - 다음날 자동 분리) */
.todo-item.is-done { cursor: default; background: transparent; }
.todo-item.is-done:hover { background: var(--bg-1); border-color: var(--border); }
.todo-item.is-done .todo-text {
  color: var(--text-3);
  text-decoration: line-through;
  text-decoration-color: var(--text-3);
}
.todo-item.is-done .todo-grip { visibility: hidden; }
.todo-actions { display: flex; gap: 2px; flex-shrink: 0; }
.todo-act {
  color: var(--text-3); padding: 4px 8px;
  font-size: 14px; font-family: var(--font-mono);
  border-radius: 4px; transition: all 0.15s; min-width: 28px;
}
.todo-act.move:hover { color: var(--info); background: rgba(96,165,250,0.1); }
.todo-act.del { font-size: 18px; }
.todo-act.del:hover { color: var(--danger); background: rgba(248,113,113,0.1); }
.todo-act.undo { font-size: 16px; }
.todo-act.undo:hover { color: var(--accent); background: rgba(251,191,36,0.1); }

/* readonly mode */
.view.readonly .add-todo,
.view.readonly .chip-x,
.view.readonly .chip-add,
.view.readonly .todo-actions,
.view.readonly .todo-grip { display: none !important; }
.view.readonly .todo-item { cursor: default; }
.view.readonly .todo-check { pointer-events: none; opacity: 0.4; }
.view.readonly .chip { cursor: default; }
.view.readonly .chip:hover { background: var(--bg-1); border-color: var(--border); color: var(--text-1); }
.view.readonly .reset-day-row { display: none !important; }

/* reset day button */
.reset-day-row { margin-top: 14px; display: flex; justify-content: flex-end; gap: 8px; }
.reset-day-btn {
  padding: 7px 14px;
  background: transparent;
  border: 1px dashed var(--border-strong);
  border-radius: var(--radius-sm);
  color: var(--text-2);
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  transition: all 0.15s;
}
.reset-day-btn:hover { color: var(--accent); border-color: var(--accent-dim); background: var(--accent-fade); }

/* missed (어제 미완료 처리된 항목) - day-detail에서 사용 */
.day-detail-item.missed::before { content: '✗'; color: var(--danger); }
.day-detail-item.missed { color: var(--text-2); }

.empty {
  padding: 32px 20px; text-align: center;
  color: var(--text-3); font-family: var(--font-mono);
  font-size: 12px; letter-spacing: 0.05em;
  border: 1px dashed var(--border); border-radius: var(--radius);
}

/* calendar */
.calendar-header {
  display: flex; align-items: center; justify-content: center;
  gap: 24px; margin-bottom: 20px;
}
.calendar-header h2 {
  font-family: var(--font-mono); font-size: 18px; font-weight: 600;
  min-width: 160px; text-align: center;
}
.cal-nav {
  width: 32px; height: 32px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-2);
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
.cal-nav:hover { color: var(--accent); border-color: var(--accent-dim); }

.calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 24px; }
.cal-dow {
  text-align: center; font-family: var(--font-mono); font-size: 10px; color: var(--text-3);
  padding: 8px 0; text-transform: uppercase; letter-spacing: 0.08em;
}
.cal-dow.sun { color: var(--danger); opacity: 0.7; }
.cal-cell {
  aspect-ratio: 1 / 1;
  background: var(--bg-1);
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  padding: 6px;
  display: flex; flex-direction: column;
  cursor: pointer; transition: all 0.15s;
  min-height: 60px;
}
.cal-cell:hover { border-color: var(--border-strong); }
.cal-cell.empty { background: transparent; cursor: default; }
.cal-cell.empty:hover { border-color: transparent; }
.cal-cell.today { border-color: var(--accent); }
.cal-cell.selected { background: var(--accent-fade); border-color: var(--accent); }
.cal-date { font-family: var(--font-mono); font-size: 12px; color: var(--text-1); }
.cal-cell.today .cal-date { color: var(--accent); font-weight: 700; }
.cal-count {
  margin-top: auto; font-family: var(--font-mono); font-size: 11px; color: var(--success);
  text-align: right; display: flex; align-items: center; justify-content: flex-end; gap: 3px;
}
.cal-count .dot { width: 5px; height: 5px; background: var(--success); border-radius: 50%; }

/* 달성률 (그날의 done / (done+missed)) */
.cal-rate {
  margin-top: auto;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  text-align: right;
  color: var(--text-3);
  letter-spacing: -0.02em;
}
.cal-rate.high { color: var(--success); }
.cal-rate.mid  { color: var(--accent); }
.cal-rate.low  { color: var(--danger); }

.day-detail {
  background: var(--bg-1); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 18px 20px; min-height: 80px;
}
.day-detail-title {
  font-family: var(--font-mono); font-size: 12px; color: var(--text-2);
  margin-bottom: 12px; display: flex; align-items: center; gap: 8px;
}
.day-detail-title strong { color: var(--accent); font-weight: 600; }
.day-detail-list { display: flex; flex-direction: column; gap: 6px; }
.day-detail-item {
  padding: 8px 12px; background: var(--bg-2); border-radius: var(--radius-sm);
  font-size: 14px; color: var(--text-1);
  display: flex; align-items: center; gap: 10px;
}
.day-detail-item::before { content: '✓'; color: var(--success); font-size: 12px; font-weight: 700; }

/* stats */
.period-tabs {
  display: flex; gap: 4px; margin-bottom: 24px;
  padding: 4px; background: var(--bg-1);
  border-radius: var(--radius); width: fit-content;
}
.period-tab {
  padding: 8px 18px; font-size: 13px; font-weight: 500;
  color: var(--text-2); border-radius: var(--radius-sm);
  transition: all 0.15s;
}
.period-tab:hover { color: var(--text-0); }
.period-tab.active { background: var(--bg-3); color: var(--accent); }

.stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 20px; }
.stat-card {
  background: var(--bg-1); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 18px;
}
.stat-card-label {
  font-family: var(--font-mono); font-size: 10px; color: var(--text-2);
  text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px;
}
.stat-card-value { font-family: var(--font-mono); font-size: 26px; font-weight: 700; letter-spacing: -0.03em; }
.stat-card-value .unit { font-size: 13px; color: var(--text-2); font-weight: 400; margin-left: 4px; }
.stat-card.accent .stat-card-value { color: var(--accent); }

.stats-section {
  background: var(--bg-1); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 20px; margin-bottom: 12px;
}
.stats-section-title {
  font-family: var(--font-mono); font-size: 11px; color: var(--text-2);
  margin-bottom: 14px; text-transform: uppercase; letter-spacing: 0.1em;
}

.top-list { display: flex; flex-direction: column; gap: 8px; }
.top-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 12px; background: var(--bg-2); border-radius: var(--radius-sm);
}
.top-rank { font-family: var(--font-mono); font-size: 11px; color: var(--accent); width: 24px; flex-shrink: 0; }
.top-text { flex: 1; font-size: 14px; color: var(--text-0); }
.top-count { font-family: var(--font-mono); font-size: 13px; color: var(--text-2); }
.top-count strong { color: var(--text-0); font-weight: 600; }

.bar-chart { width: 100%; }
.chart-plot {
  position: relative;
  height: 120px;
  padding-top: 20px;
  box-sizing: border-box;
}
.chart-bars {
  display: flex; align-items: flex-end; gap: 3px;
  height: 100%;
}
.chart-bars .bar-col {
  flex: 1; height: 100%;
  display: flex; align-items: flex-end;
  min-width: 0;
  cursor: pointer;
  position: relative;
}
.bar {
  width: 100%; background: var(--accent-dim);
  border-radius: 2px 2px 0 0; min-height: 2px;
  transition: background 0.15s; position: relative;
}
.bar:hover { background: var(--accent); }
.bar-col.active .bar { background: var(--accent); }
.bar-col.active .bar-val { color: var(--accent); font-weight: 700; }

/* hover/click 시 막대 위로 뜨는 툴팁 */
.chart-tooltip {
  position: absolute;
  background: var(--bg-3);
  border: 1px solid var(--border-strong);
  color: var(--text-0);
  padding: 8px 11px;
  border-radius: var(--radius-sm);
  font-family: var(--font-mono);
  font-size: 11px;
  line-height: 1.55;
  pointer-events: none;
  white-space: nowrap;
  box-shadow: 0 6px 20px rgba(0,0,0,0.55);
  z-index: 30;
  transform: translate(-50%, -100%);
  margin-top: -8px;
  min-width: 120px;
  display: none;
}
.chart-tooltip-label {
  color: var(--accent);
  font-weight: 700;
  margin-bottom: 6px;
  padding-bottom: 5px;
  border-bottom: 1px solid var(--border);
  text-align: center;
  font-size: 11px;
}
.chart-tooltip-row {
  display: flex; justify-content: space-between; gap: 16px;
  color: var(--text-2);
  font-size: 11px;
}
.chart-tooltip-row .v {
  color: var(--text-0);
  font-weight: 600;
}
.chart-tooltip-row .v.rate-high { color: var(--success); }
.chart-tooltip-row .v.rate-low  { color: var(--danger); }
.bar-val {
  font-family: var(--font-mono); font-size: 9px; color: var(--text-2);
  position: absolute; top: -14px; left: 50%; transform: translateX(-50%); white-space: nowrap;
}
.bar-label { font-family: var(--font-mono); font-size: 9px; color: var(--text-3); white-space: nowrap; }

/* line overlay + dots */
.line-svg {
  position: absolute;
  inset: 20px 0 0 0;
  width: 100%; height: calc(100% - 20px);
  pointer-events: none;
  overflow: visible;
}
.line-svg polyline {
  fill: none;
  stroke: var(--info);
  stroke-width: 1.5;
  stroke-linejoin: round;
  stroke-linecap: round;
  vector-effect: non-scaling-stroke;
}
.dots-layer {
  position: absolute;
  inset: 20px 0 0 0;
  pointer-events: none;
}
.dot {
  position: absolute;
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--info);
  border: 1.5px solid var(--bg-1);
  transform: translate(-50%, -50%);
  pointer-events: auto;
  cursor: help;
}
.chart-x-labels {
  display: flex; gap: 3px; margin-top: 6px;
}
.chart-x-labels > div {
  flex: 1; text-align: center;
  color: var(--text-3); font-family: var(--font-mono);
  font-size: 9px; white-space: nowrap;
}
.chart-legend {
  display: flex; gap: 16px; justify-content: flex-end;
  margin-top: 14px;
  font-family: var(--font-mono); font-size: 10px;
  color: var(--text-2); letter-spacing: 0.05em;
}
.chart-legend > span { display: inline-flex; align-items: center; gap: 6px; }
.bar-swatch { width: 10px; height: 10px; background: var(--accent-dim); border-radius: 2px; display: inline-block; }
.line-swatch { width: 16px; height: 1.5px; background: var(--info); position: relative; display: inline-block; }
.line-swatch::after {
  content: ''; position: absolute;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  width: 5px; height: 5px;
  background: var(--info); border: 1.5px solid var(--bg-1);
  border-radius: 50%;
}

.toast {
  position: fixed; bottom: 24px; left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--bg-3); border: 1px solid var(--border-strong);
  color: var(--text-0); padding: 10px 18px;
  border-radius: var(--radius); font-size: 13px;
  opacity: 0; pointer-events: none;
  transition: all 0.2s ease; z-index: 100;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.error { border-color: var(--danger); color: var(--danger); }

.loading {
  display: flex; align-items: center; justify-content: center;
  padding: 60px 20px; color: var(--text-3);
  font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.1em;
}

@media (max-width: 600px) {
  #app { padding: 0 14px 60px; }
  .topbar { padding-top: 20px; }
  .topbar-row { flex-direction: column; align-items: flex-start; gap: 12px; }
  .brand-title { font-size: 18px; }
  .view-tab { padding: 12px 14px; }
  .stats-grid { grid-template-columns: 1fr 1fr; }
  .stats-grid .stat-card:nth-child(3) { grid-column: 1 / -1; }
  .cal-cell { min-height: 44px; padding: 4px; }
  .cal-date { font-size: 11px; }
  .cal-count { font-size: 10px; }
  .cal-rate { font-size: 10px; }
  .chart-tooltip { font-size: 10px; min-width: 100px; padding: 6px 9px; }
  .me-name { max-width: 100px; }
}
</style>
</head>
<body>

<div id="app">
  <header class="topbar">
    <div class="topbar-row">
      <div class="brand">
        <div class="brand-mark">▣</div>
        <div class="brand-text">
          <div class="brand-title">TO-do</div>

        </div>
      </div>
      <div class="auth-area" id="authArea"></div>
    </div>
    <nav class="user-tabs" id="userTabs"></nav>
  </header>

  <nav class="view-nav">

    <button class="view-tab" data-view="calendar">

      <span class="view-tab-label">달력</span>
    </button>
    <button class="view-tab" data-view="stats">

      <span class="view-tab-label">통계</span>

  <main class="content">

        <div class="todos" id="todosList"></div>

        <div class="reset-day-row">
          <button id="copyTodayBtn" class="reset-day-btn" title="오늘 완료/미완료 항목을 텍스트로 복사합니다">⧉ 결과 복사</button>
          <button id="resetDayBtn" class="reset-day-btn" title="오늘의 미완료 항목들을 어제 날짜로 미완료 처리합니다">↺ 하루 초기화</button>
        </div>
      </div>

      <div class="todo-section">
        <div class="section-label muted">해야 할 일</div>
        <div class="add-todo subtle">
          <input type="text" id="backlogInput" placeholder="언젠가 해야 할 일..." maxlength="200" />
          <button id="addBacklogBtn">추가</button>
        </div>
        <div class="todos" id="backlogList"></div>
      </div>

    <section id="view-calendar" class="view">
      <div class="calendar-header">

      </div>
      <div class="calendar-grid" id="calendarGrid"></div>
      <div class="day-detail" id="dayDetail">
        <div class="day-detail-title">날짜를 선택하세요</div>
      </div>
    </section>

    <section id="view-stats" class="view">
      <div class="period-tabs">
        <button class="period-tab active" data-period="week">주간</button>
        <button class="period-tab" data-period="month">월간</button>
        <button class="period-tab" data-period="year">연간</button>
      </div>
      <div id="statsContent"><div class="loading">— LOADING</div></div>
    </section>
  </main>
</div>

<div id="toast" class="toast"></div>

<script>
// ═════════════════════════════════════════════
// CONFIG — 본인 값으로 교체
// ═════════════════════════════════════════════
const API_URL = 'https://script.google.com/macros/s/AKfycbyxvFZKtBT8gz4jni7b-xZ0oBvX21jBXhwhOTsKW_PgQYFWsjwUmfw-13zAuoUDPa4J/exec';
const GOOGLE_CLIENT_ID = '1077038002206-30kme3htm5kkajnm3idltq8kv09als0k.apps.googleusercontent.com';

const FLUSH_DEBOUNCE_MS = 1500;
const QUEUE_STORAGE_KEY = 'todo_queue_v3';
const AUTH_STORAGE_KEY = 'todo_auth_v3';
const DATA_CACHE_PREFIX = 'todo_data_v1_';
const USERS_CACHE_KEY = 'todo_users_v1';

// ═════════════════════════════════════════════
// State
// ═════════════════════════════════════════════
const state = {
  users: [], currentUser: null,
  todos: [], shortcuts: [], completed: [],
  view: 'today', period: 'week',
  calYear: null, calMonth: null, calSelected: null
};

// ═════════════════════════════════════════════
// Local data cache (stale-while-revalidate)
// ═════════════════════════════════════════════
const dataCache = {
  key(user) { return DATA_CACHE_PREFIX + user; },
  get(user) {
    try {
      const raw = localStorage.getItem(this.key(user));
      if (!raw) return null;
      return JSON.parse(raw);
    } catch (e) { return null; }
  },
  set(user, data) {
    try {
      localStorage.setItem(this.key(user), JSON.stringify({
        todos: data.todos || [],
        shortcuts: data.shortcuts || [],
        completed: data.completed || [],
        ts: Date.now()
      }));
    } catch (e) { /* quota or disabled */ }
  },
  clear(user) {
    try { localStorage.removeItem(this.key(user)); } catch (e) {}
  }
};

const usersCache = {
  get() {
    try {
      const raw = localStorage.getItem(USERS_CACHE_KEY);
      if (!raw) return null;
      return JSON.parse(raw);
    } catch (e) { return null; }
  },
  set(users) {
    try { localStorage.setItem(USERS_CACHE_KEY, JSON.stringify(users || [])); }
    catch (e) {}
  }
};

function saveCurrentToCache() {
  if (!state.currentUser) return;
  dataCache.set(state.currentUser, {
    todos: state.todos,
    shortcuts: state.shortcuts,
    completed: state.completed
  });
}

// ═════════════════════════════════════════════
// Auth
// ═════════════════════════════════════════════
const auth = {
  idToken: null, email: null, name: null, picture: null, exp: 0,
  load() {
    try {
      const data = JSON.parse(localStorage.getItem(AUTH_STORAGE_KEY) || 'null');
      if (!data) return;
      if (Date.now() >= Number(data.exp) * 1000) {
        localStorage.removeItem(AUTH_STORAGE_KEY);
        return;
      }
      Object.assign(this, data);
    } catch (e) {}
  },
  save() {
    localStorage.setItem(AUTH_STORAGE_KEY, JSON.stringify({
      idToken: this.idToken, email: this.email,
      name: this.name, picture: this.picture, exp: this.exp
    }));
  },
  setFromToken(idToken) {
    const payload = decodeJWT(idToken);
    if (!payload) return false;
    this.idToken = idToken;
    this.email = String(payload.email || '').toLowerCase();
    this.name = payload.name || payload.email || '';
    this.picture = payload.picture || '';
    this.exp = Number(payload.exp) || 0;
    this.save();
    return true;
  },
  isValid() {
    return !!(this.idToken && this.email && Date.now() < this.exp * 1000);
  },
  clear() {
    this.idToken = null; this.email = null; this.name = null;
    this.picture = null; this.exp = 0;
    localStorage.removeItem(AUTH_STORAGE_KEY);
  }
};

function decodeJWT(token) {
  try {
    const b64 = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
    const pad = '='.repeat((4 - b64.length % 4) % 4);
    const bin = atob(b64 + pad);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return JSON.parse(new TextDecoder('utf-8').decode(bytes));
  } catch (e) { return null; }
}

// GIS 콜백 (스크립트 로드 후 호출)
function handleCredentialResponse(response) {
  if (!response || !response.credential) return;
  if (!auth.setFromToken(response.credential)) return;
  showToast('로그인됨: ' + auth.email);
  // 본인 user 자동 활성화
  const me = state.users.find(u => u.email === auth.email);
  if (me) {
    state.currentUser = me.name;
    localStorage.setItem('todo_last_user', me.name);
    loadUserAll();
  } else {
    // 본인 등록 안 됨 → 그대로 두고 등록 안내 노출
  }
  renderAuthArea();
  renderUserTabs();
  renderRoBanner();
  renderAll();
}

window.handleCredentialResponse = handleCredentialResponse;

function initGIS() {
  if (!window.google || !google.accounts || !google.accounts.id) return false;
  if (GOOGLE_CLIENT_ID.includes('여기에')) return false;
  google.accounts.id.initialize({
    client_id: GOOGLE_CLIENT_ID,
    callback: handleCredentialResponse,
    auto_select: true,
    cancel_on_tap_outside: false
  });
  return true;
}

function promptSignIn() {
  if (!initGIS()) {
    showToast('Google 로그인 라이브러리 로드 중...', true);
    return;
  }
  google.accounts.id.prompt();
}

function logout() {
  auth.clear();
  if (window.google && google.accounts && google.accounts.id) {
    google.accounts.id.disableAutoSelect();
  }
  renderAuthArea();
  renderUserTabs();
  renderRoBanner();
  renderAll();
  showToast('로그아웃됨');
}

// ═════════════════════════════════════════════
// Utils
// ═════════════════════════════════════════════
const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => Array.from(document.querySelectorAll(sel));
const el = (tag, attrs, ...children) => {
  const node = document.createElement(tag);
  if (attrs) {
    for (const k in attrs) {
      if (k === 'class') node.className = attrs[k];
      else if (k === 'text') node.textContent = attrs[k];
      else if (k.startsWith('on')) node.addEventListener(k.slice(2), attrs[k]);
      else if (k === 'dataset') Object.assign(node.dataset, attrs[k]);
      else node.setAttribute(k, attrs[k]);
    }
  }
  children.flat().forEach(c => {
    if (c == null) return;
    node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return node;
};

function pad2(n) { return String(n).padStart(2, '0'); }
function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}
// 새벽 6시 기준 "활동일" 문자열
//  - 06:00 ~ 23:59 → 오늘
//  - 00:00 ~ 05:59 → 어제 (아직 전날 활동의 연장으로 본다)
// 자정 직전/직후에 하루 초기화를 눌러도 동일한 날짜로 기록되도록 함.
function activeDayStr() {
  const d = new Date();
  if (d.getHours() < 6) {
    d.setDate(d.getDate() - 1);
  }
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}
// 시계상 어제 (resetDay 기록용 — 항상 직전 활동일을 가리킴)
function yesterdayStr() {
  const d = new Date();
  d.setDate(d.getDate() - 1);
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}
function nowISO() { return new Date().toISOString(); }
function newId() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'id-' + Date.now() + '-' + Math.random().toString(36).slice(2, 9);
}

function showToast(msg, isErr) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.toggle('error', !!isErr);
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2400);
}

function refreshBrand() {
  const sub = $('#brandSub');
  sub.classList.remove('sync', 'pending', 'error');
  if (queue.flushing) {
    sub.classList.add('sync');
    sub.textContent = '— SYNC ' + queue.size();
  } else if (queue.size() > 0) {
    sub.classList.add('pending');
    sub.textContent = '— PENDING ' + queue.size();
  } else if (state.currentUser) {
    sub.textContent = '— ' + state.currentUser.toUpperCase();
  } else {
    sub.textContent = '— READY';
  }
}

// ═════════════════════════════════════════════
// 권한
// ═════════════════════════════════════════════
function emailForUser(name) {
  const u = state.users.find(x => x.name === name);
  return u ? (u.email || '') : '';
}
function canEditCurrentTab() {
  if (!auth.isValid()) return false;
  if (!state.currentUser) return false;
  const e = emailForUser(state.currentUser);
  return e && e === auth.email;
}
function myUser() {
  if (!auth.isValid()) return null;
  return state.users.find(u => u.email === auth.email) || null;
}

// ═════════════════════════════════════════════
// API
// ═════════════════════════════════════════════
async function api(action, params) {
  const body = Object.assign({ action: action }, params || {});
  if (auth.isValid()) body.idToken = auth.idToken;
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body),
    redirect: 'follow'
  });
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || 'unknown');
  return json.data;
}

// ═════════════════════════════════════════════
// Queue
// ═════════════════════════════════════════════
const queue = {
  ops: [], flushing: false,
  load() {
    try { this.ops = JSON.parse(localStorage.getItem(QUEUE_STORAGE_KEY) || '[]'); }
    catch (e) { this.ops = []; }
  },
  save() { localStorage.setItem(QUEUE_STORAGE_KEY, JSON.stringify(this.ops)); },
  size() { return this.ops.length; },
  push(op, payload) {
    this.ops.push({ op, payload });
    this.save();
    refreshBrand();
    scheduleFlush();
  },
  async flush() {
    if (this.flushing) return;
    if (this.ops.length === 0) return;
    if (!auth.isValid()) {
      // 인증 만료/없음 → 큐 유지, 로그인 시 재시도
      return;
    }
    this.flushing = true;
    refreshBrand();
    const sending = this.ops.slice();
    try {
      const res = await api('batch', { ops: sending });
      if (res && res.results) {
        // 성공한 인덱스만 큐에서 제거 (실패는 남겨서 재시도/노출)
        const failedIdx = new Set(
          res.results.filter(r => !r.ok).map(r => r.i)
        );
        const remaining = [];
        for (let i = 0; i < sending.length; i++) {
          if (failedIdx.has(i)) remaining.push(sending[i]);
        }
        // sending 이후에 push된 op들은 보존
        this.ops = remaining.concat(this.ops.slice(sending.length));
        this.save();
        if (failedIdx.size) {
          const firstFail = res.results.find(r => !r.ok);
          console.warn('[batch partial fail]', res.results.filter(r => !r.ok));
          showToast(failedIdx.size + '건 실패: ' + (firstFail && firstFail.error || '알 수 없음'), true);
        }
      } else {
        // 예외적: results 없으면 전부 성공 처리
        this.ops.splice(0, sending.length);
        this.save();
      }
    } catch (e) {
      // 네트워크/서버 실패: 큐 유지 (재시도 가능)
      console.error('[flush]', e);
    } finally {
      this.flushing = false;
      refreshBrand();
    }
  },
  beacon() {
    // 페이지 떠날 때 마지막 시도. 응답을 못 받으니 큐는 비우지 않고
    // 다음 세션의 boot()에서 다시 flush. 백엔드가 LockService + idempotent라 중복 안 됨.
    if (this.ops.length === 0 || !auth.isValid()) return;
    const body = JSON.stringify({ action: 'batch', ops: this.ops, idToken: auth.idToken });
    try {
      const blob = new Blob([body], { type: 'text/plain;charset=utf-8' });
      navigator.sendBeacon(API_URL, blob);
    } catch (e) {}
  }
};

let flushTimer = null;
function scheduleFlush(delay) {
  clearTimeout(flushTimer);
  flushTimer = setTimeout(() => queue.flush(), delay == null ? FLUSH_DEBOUNCE_MS : delay);
}

// ═════════════════════════════════════════════
// Bootstrap
// ═════════════════════════════════════════════
async function boot() {
  auth.load();
  queue.load();
  refreshBrand();
  renderAuthArea();

  if (API_URL.includes('여기에')) {
    $('#brandSub').textContent = '— CONFIG REQUIRED';
    showToast('API_URL 설정 필요 (index.html 상단)', true);
    return;
  }

  // 1. users 캐시가 있으면 즉시 UI 구성 후, 마지막 유저의 캐시 데이터로 화면 띄움
  const cachedUsers = usersCache.get();
  if (cachedUsers && cachedUsers.length) {
    state.users = cachedUsers;
    renderAuthArea();
    renderUserTabs();
    renderRoBanner();

    // 가능하면 현재 유저 정해서 캐시 데이터 즉시 렌더
    const me = myUser();
    if (me) {
      state.currentUser = me.name;
    } else {
      const last = localStorage.getItem('todo_last_user');
      const found = state.users.find(u => u.name === last);
      state.currentUser = (found && found.name) || state.users[0].name;
    }
    const userCache = dataCache.get(state.currentUser);
    if (userCache) {
      state.todos = userCache.todos || [];
      state.shortcuts = userCache.shortcuts || [];
      state.completed = userCache.completed || [];
      renderUserTabs();
      renderAll();
    }
  }

  $('#brandSub').textContent = '— CONNECTING';

  try {
    if (queue.size() > 0 && auth.isValid()) await queue.flush();

    // 2. 최신 users 가져오기
    state.users = await api('getAllUsers');
    usersCache.set(state.users);
    renderAuthArea();
    renderUserTabs();
    renderRoBanner();

    if (!state.users.length) {
      $('#brandSub').textContent = '— NO USERS';
      return;
    }
    // 자동 user 선택: 본인 우선 → 마지막 선택 → 첫번째
    const me = myUser();
    if (me) {
      state.currentUser = me.name;
      localStorage.setItem('todo_last_user', me.name);
    } else {
      const last = localStorage.getItem('todo_last_user');
      const found = state.users.find(u => u.name === last);
      state.currentUser = (found && found.name) || state.users[0].name;
    }
    renderUserTabs();
    await loadUserAll();
  } catch (e) {
    console.error(e);
    $('#brandSub').classList.add('error');
    $('#brandSub').textContent = '— ERROR';
    // 캐시가 있어서 화면은 살아있으니 에러만 표시
    if (!cachedUsers) showToast('초기화 실패: ' + e.message, true);
  }
}

// loadUserAll 동시성 가드 - 늦게 도착한 fetch 응답이 현재 화면 덮어쓰는 것 방지
let _loadToken = 0;

// 서버에서 막 받아온 데이터에 아직 미전송된 큐 op들을 재적용.
// (서버 fetch가 큐 flush보다 먼저 끝나는 race 방지)
function applyPendingOps(targetUser) {
  for (const op of queue.ops) {
    const p = op.payload || {};
    switch (op.op) {
      case 'addTodo':
        if (p.user !== targetUser) break;
        if (!state.todos.some(t => t.id === p.id)) {
          state.todos.push({
            id: p.id, user: p.user, text: p.text,
            order: p.order, created_at: p.created_at, type: p.type
          });
        }
        break;
      case 'deleteTodo':
        state.todos = state.todos.filter(t => t.id !== p.id);
        break;
      case 'completeTodo': {
        const t = state.todos.find(x => x.id === p.id);
        state.todos = state.todos.filter(x => x.id !== p.id);
        if (t && !state.completed.some(c => c.id === p.id)) {
          state.completed.push({
            id: t.id, user: t.user, text: t.text,
            completed_date: p.completed_date, completed_at: p.completed_at,
            created_at: t.created_at, status: p.status || 'done'
          });
        }
        break;
      }
      case 'uncompleteTodo': {
        const c = state.completed.find(x => x.id === p.id);
        state.completed = state.completed.filter(x => x.id !== p.id);
        if (c && !state.todos.some(t => t.id === p.id)) {
          state.todos.push({
            id: c.id, user: c.user, text: c.text,
            order: 9999, created_at: c.created_at, type: 'today'
          });
        }
        break;
      }
      case 'moveTodo': {
        const t = state.todos.find(x => x.id === p.id);
        if (t) t.type = p.type;
        break;
      }
      case 'reorderTodos':
        if (p.user !== targetUser || !p.orderedIds) break;
        p.orderedIds.forEach((id, idx) => {
          const t = state.todos.find(x => x.id === id);
          if (t) t.order = idx + 1;
        });
        break;
      case 'addShortcut':
        if (p.user !== targetUser) break;
        if (!state.shortcuts.some(s => s.id === p.id)) {
          state.shortcuts.push({
            id: p.id, user: p.user, text: p.text, created_at: p.created_at
          });
        }
        break;
      case 'deleteShortcut':
        state.shortcuts = state.shortcuts.filter(s => s.id !== p.id);
        break;
    }
  }
}

async function loadUserAll() {
  const targetUser = state.currentUser;
  if (!targetUser) return;
  const myToken = ++_loadToken;

  // 1. 캐시 즉시 표시 (동기 - race 위험 없음)
  const cached = dataCache.get(targetUser);
  let hasCached = false;
  if (cached) {
    state.todos = cached.todos || [];
    state.shortcuts = cached.shortcuts || [];
    state.completed = cached.completed || [];
    hasCached = true;
    renderAll();
  } else {
    // 캐시 없으면 빈 상태로 즉시 (이전 사용자 데이터 잔존 방지)
    state.todos = [];
    state.shortcuts = [];
    state.completed = [];
    renderAll();
  }

  // 2. 백그라운드에서 최신 데이터 가져와 갱신
  try {
    const [ud, completed] = await Promise.all([
      api('getUserData', { user: targetUser }),
      api('getCompleted', { user: targetUser })
    ]);
    // Race 가드: 더 새로운 요청이 있었거나 사용자 탭이 바뀌었으면 응답 폐기
    if (myToken !== _loadToken) return;
    if (state.currentUser !== targetUser) return;

    state.todos = ud.todos || [];
    state.shortcuts = ud.shortcuts || [];
    state.completed = completed || [];
    // 아직 서버에 반영 안된 pending op들을 UI에 재적용 (race 보호)
    applyPendingOps(targetUser);
    // 캐시는 fetch 당시 user 키로 저장 (state.currentUser 안 씀)
    dataCache.set(targetUser, {
      todos: state.todos,
      shortcuts: state.shortcuts,
      completed: state.completed
    });
    renderAll();
  } catch (e) {
    if (myToken !== _loadToken) return;
    if (state.currentUser !== targetUser) return;
    if (!hasCached) {
      showToast('데이터 로드 실패', true);
    }
    // 캐시가 있었으면 그대로 유지 (오프라인 모드)
  }
  if (myToken === _loadToken) refreshBrand();
}

    wrap.appendChild(el('button', {

// ═════════════════════════════════════════════
// Render: read-only banner
// ═════════════════════════════════════════════
function renderRoBanner() {
  const wrap = $('#roBanner');
  wrap.innerHTML = '';
  if (canEditCurrentTab()) return;

  if (!auth.isValid()) {
    wrap.appendChild(el('div', { class: 'ro-banner signin-needed' },
      el('span', { text: '보기 모드 · 수정하려면 Google 로그인이 필요합니다' })
    ));
  } else if (state.currentUser) {
    const ownerEmail = emailForUser(state.currentUser);
    if (!ownerEmail) {
      wrap.appendChild(el('div', { class: 'ro-banner' },

      ));
    } else {
      wrap.appendChild(el('div', { class: 'ro-banner' },
        el('span', { text: state.currentUser + '의 탭 · 본인 데이터만 수정 가능합니다' })
      ));
    }
  }
}

// ═════════════════════════════════════════════
// Render: user tabs
// ═════════════════════════════════════════════
function renderUserTabs() {
  const wrap = $('#userTabs');
  wrap.innerHTML = '';
  const meEmail = auth.isValid() ? auth.email : null;
  state.users.forEach(u => {
    const classes = ['user-tab'];
    if (u.name === state.currentUser) classes.push('active');
    if (meEmail && u.email === meEmail) classes.push('is-me');
    wrap.appendChild(el('button', {
      class: classes.join(' '),
      text: u.name,
      title: u.email ? u.email : '이메일 미매핑',
      onclick: () => switchUser(u.name)
    }));
  });
  // 본인이 아직 등록 안 된 경우: 본인 등록 버튼
  if (auth.isValid() && !myUser()) {
    wrap.appendChild(el('button', {
      class: 'user-tab user-tab-claim',
      text: '+ 본인 등록',
      title: '내 Google 계정을 사용자로 등록',
      onclick: claimMePrompt
    }));
  }
}

async function switchUser(name) {
  if (name === state.currentUser) return;
  // 큐 flush는 fire-and-forget (탭 전환을 막지 않음)
  // 큐에는 본인 작업만 들어있고 다른 user의 데이터 fetch와는 무관.
  if (queue.size() > 0 && auth.isValid()) queue.flush();
  state.currentUser = name;
  localStorage.setItem('todo_last_user', name);
  renderUserTabs();
  renderRoBanner();
  // loadUserAll 안에서 캐시 즉시 표시 → 백그라운드 갱신
  loadUserAll();
}

async function claimMePrompt() {
  if (!auth.isValid()) return;
  const existing = state.users.find(u => !u.email);
  const hint = existing ? '\n(이미 시트에 있는 빈 이름을 그대로 입력하면 이메일이 자동 매핑됩니다)' : '';
  const name = (prompt('등록할 이름을 입력하세요' + hint) || '').trim();
  if (!name) return;
  try {
    const res = await api('addUser', { name });
    // users 새로고침
    state.users = await api('getAllUsers');
    state.currentUser = res.name;
    localStorage.setItem('todo_last_user', res.name);
    renderAuthArea();
    renderUserTabs();
    renderRoBanner();
    await loadUserAll();
    showToast(res.claimed ? '본인으로 매핑됨: ' + name : '등록됨: ' + name);
  } catch (e) {
    showToast('등록 실패: ' + e.message, true);
  }
}

// Render: all
// ═════════════════════════════════════════════
function renderAll() {
  // view-today에 readonly 클래스 토글
  $('#view-today').classList.toggle('readonly', !canEditCurrentTab());
  renderTodos();
  renderShortcuts();
  renderCalendar();
  renderStats();
  refreshBrand();

}

// ═════════════════════════════════════════════
// Render: todos
// ═════════════════════════════════════════════
function renderTodos() {
  renderTodoListByType('today', $('#todosList'));
  renderTodoListByType('backlog', $('#backlogList'));
}

function renderTodoListByType(type, wrap) {
  wrap.innerHTML = '';
  const editable = canEditCurrentTab();
  const items = state.todos
    .filter(t => (t.type || 'today') === type)
    .sort((a, b) => a.order - b.order);

  // 오늘 섹션에만: 활동일(6시 cutoff)로 완료된 항목들을 체크 상태로 함께 표시
  // 자정 넘어 완료해도 같은 활동일이면 계속 "오늘" 섹션에 표시됨
  const today = activeDayStr();
  const doneToday = type === 'today'
    ? state.completed
        .filter(c => c.completed_date === today && c.status !== 'missed')
        .sort((a, b) => String(a.completed_at).localeCompare(String(b.completed_at)))
    : [];

  if (!items.length && !doneToday.length) {
    const msg = type === 'today'
      ? '— 오늘의 할 일이 비어있습니다 —'
      : '— 백로그가 비어있습니다 —';
    wrap.appendChild(el('div', { class: 'empty', text: msg }));
    return;
  }

  // 미완료 항목 먼저
  items.forEach(t => {
    const moveArrow = type === 'today' ? '↓' : '↑';
    const moveTitle = type === 'today' ? '백로그로 이동' : '오늘로 이동';
    const targetType = type === 'today' ? 'backlog' : 'today';

    const item = el('div', {
      class: 'todo-item' + (type === 'backlog' ? ' backlog' : ''),
      draggable: editable ? 'true' : 'false',
      dataset: { id: t.id, type: type }
    },
      el('span', { class: 'todo-grip', text: '⋮⋮' }),
      el('button', {
        class: 'todo-check',
        title: editable ? '완료' : '보기 모드',
        onclick: (e) => { e.stopPropagation(); if (editable) completeTodo(t.id); }
      }),
      el('div', { class: 'todo-text', text: t.text }),
      el('div', { class: 'todo-actions' },
        el('button', {
          class: 'todo-act move',
          text: moveArrow,
          title: moveTitle,
          onclick: (e) => { e.stopPropagation(); moveTodo(t.id, targetType); }
        }),
        el('button', {
          class: 'todo-act del',
          text: '×',
          title: '삭제',
          onclick: (e) => { e.stopPropagation(); deleteTodo(t.id); }
        })
      )
    );
    if (editable) attachDrag(item, type);
    wrap.appendChild(item);
  });

  // 오늘 완료된 항목 (체크 표시 상태)
  doneToday.forEach(c => {
    const item = el('div', {
      class: 'todo-item is-done',
      dataset: { id: c.id }
    },
      el('span', { class: 'todo-grip', text: '⋮⋮' }),
      el('div', {
        class: 'todo-check checked',
        title: '오늘 완료됨',
        text: '✓'
      }),
      el('div', { class: 'todo-text', text: c.text }),
      el('div', { class: 'todo-actions' },
        editable ? el('button', {
          class: 'todo-act undo',
          text: '↩',
          title: '완료 취소',
          onclick: (e) => { e.stopPropagation(); uncompleteTodo(c.id); }
        }) : null
      )
    );
    wrap.appendChild(item);
  });
}

function renderShortcuts() {
  const wrap = $('#shortcutsList');
  wrap.innerHTML = '';
  const editable = canEditCurrentTab();
  state.shortcuts.forEach(s => {
    const chip = el('div', {
      class: 'chip',
      onclick: () => { if (editable) addTodoFromShortcut(s.text); }
    },
      el('span', { text: s.text }),
      el('button', {
        class: 'chip-x',
        text: '×',
        title: '단축어 삭제',
        onclick: (e) => { e.stopPropagation(); deleteShortcut(s.id); }
      })
    );
    wrap.appendChild(chip);
  });
  if (editable) {
    wrap.appendChild(el('button', {
      class: 'chip chip-add',
      text: '+ 단축어',
      onclick: addShortcutPrompt
    }));
  }
}

// ═════════════════════════════════════════════
// Mutations
// ═════════════════════════════════════════════
function guard() {
  if (!canEditCurrentTab()) {
    if (!auth.isValid()) showToast('Google 로그인이 필요합니다', true);
    else showToast('본인 탭에서만 수정할 수 있습니다', true);
    return false;
  }
  return true;
}

function maxOrderOf(type) {
  let m = 0;
  state.todos.forEach(t => {
    if ((t.type || 'today') === type && t.order > m) m = t.order;
  });
  return m;
}

// 빠른 더블 클릭/엔터/터치 중복으로 인한 같은 항목 중복 추가 방지
//  - 동일 (user, text, type) 조합이 1초 이내 다시 들어오면 무시
//  - 1초 후엔 사용자가 의도적으로 같은 항목 다시 추가 가능
let _lastAdd = { key: '', t: 0 };

function addTodoCore(text, type) {
  if (!guard()) return;
  if (!text || !state.currentUser) return;

  const key = state.currentUser + '|' + type + '|' + text;
  const now = Date.now();
  if (_lastAdd.key === key && (now - _lastAdd.t) < 1000) {
    console.warn('[addTodo] duplicate suppressed:', text);
    return;
  }
  _lastAdd = { key: key, t: now };

  const id = newId();
  const order = maxOrderOf(type) + 1;
  const created_at = nowISO();
  const todo = { id, user: state.currentUser, text, order, created_at, type };
  state.todos.push(todo);
  renderTodos();
  saveCurrentToCache();
  queue.push('addTodo', { id, user: state.currentUser, text, order, created_at, type });
}

function addTodoFromInput() {
  const input = $('#todoInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  addTodoCore(text, 'today');
}

function addBacklogFromInput() {
  const input = $('#backlogInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  addTodoCore(text, 'backlog');
}

function addTodoFromShortcut(text) {
  addTodoCore(text, 'today');
  if (canEditCurrentTab()) showToast('추가됨: ' + text);
}

function deleteTodo(id) {
  if (!guard()) return;
  state.todos = state.todos.filter(t => t.id !== id);
  renderTodos();
  saveCurrentToCache();
  queue.push('deleteTodo', { id });
}

function completeTodo(id) {
  if (!guard()) return;
  const t = state.todos.find(x => x.id === id);
  if (!t) return;
  state.todos = state.todos.filter(x => x.id !== id);
  const completed_at = nowISO();
  const completed_date = activeDayStr();  // 새벽 6시 cutoff 기준
  state.completed.push({
    id: t.id, user: t.user, text: t.text,
    completed_date, completed_at, created_at: t.created_at,
    status: 'done'
  });
  renderTodos();
  renderCalendar();
  renderStats();
  saveCurrentToCache();
  showToast('완료: ' + t.text);
  queue.push('completeTodo', { id, completed_at, completed_date, status: 'done' });
}

// 완료 취소: Completed에서 빼서 다시 오늘 할일로 복귀
function uncompleteTodo(id) {
  if (!guard()) return;
  const c = state.completed.find(x => x.id === id);
  if (!c) return;
  state.completed = state.completed.filter(x => x.id !== id);
  // 동일 id가 todos에 이미 있으면 (이상한 상태) 스킵
  if (!state.todos.some(t => t.id === id)) {
    state.todos.push({
      id: c.id, user: c.user, text: c.text,
      order: maxOrderOf('today') + 1,
      created_at: c.created_at,
      type: 'today'
    });
  }
  renderTodos();
  renderCalendar();
  renderStats();
  saveCurrentToCache();
  showToast('완료 취소: ' + c.text);
  queue.push('uncompleteTodo', { id });
}

// 오늘 결과(완료/미완료) 텍스트 복사
function copyToday() {
  if (!state.currentUser) {
    showToast('사용자를 먼저 선택하세요', true);
    return;
  }
  const date = activeDayStr(); // 6시 cutoff 기준 활동일

  // 요일 계산
  const d = new Date(date + 'T00:00:00');
  const weekday = ['일','월','화','수','목','금','토'][d.getDay()];
  const displayDate = (d.getMonth() + 1) + '/' + d.getDate() + ' (' + weekday + ')';

  // 오늘 완료 항목 (완료 시각 순)
  const doneItems = state.completed
    .filter(c => c.completed_date === date && c.status === 'done')
    .sort((a, b) => {
      const ta = new Date(a.completed_at).getTime() || 0;
      const tb = new Date(b.completed_at).getTime() || 0;
      return ta - tb;
    })
    .map(c => c.text);

  // 오늘 미완료 항목 (오늘 할일로 분류된 것, 정렬 순서대로)
  const undoneItems = state.todos
    .filter(t => (t.type || 'today') === 'today')
    .sort((a, b) => (a.order || 0) - (b.order || 0))
    .map(t => t.text);

  if (!doneItems.length && !undoneItems.length) {
    showToast('오늘 항목이 없습니다');
    return;
  }

  const lines = [];
  lines.push('📅 ' + displayDate + ' ' + state.currentUser);
  lines.push('');
  lines.push('✅ 완료 (' + doneItems.length + ')');
  if (doneItems.length) {
    doneItems.forEach(t => lines.push('• ' + t));
  } else {
    lines.push('• (없음)');
  }
  lines.push('');
  lines.push('⏳ 미완료 (' + undoneItems.length + ')');
  if (undoneItems.length) {
    undoneItems.forEach(t => lines.push('• ' + t));
  } else {
    lines.push('• (없음)');
  }

  const text = lines.join('\n');

  copyToClipboard(text).then(() => {
    showToast('복사됨 (완료 ' + doneItems.length + ' / 미완료 ' + undoneItems.length + ')');
  }).catch(() => {
    showToast('복사 실패', true);
  });
}

// 클립보드 복사 (모던 API + fallback)
function copyToClipboard(text) {
  if (navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext) {
    return navigator.clipboard.writeText(text);
  }
  return new Promise((resolve, reject) => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.top = '0';
      ta.style.left = '0';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      ta.setSelectionRange(0, text.length);
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      if (ok) resolve();
      else reject(new Error('execCommand copy failed'));
    } catch (e) {
      reject(e);
    }
  });
}

function resetDay() {
  if (!guard()) return;
  const todayItems = state.todos.filter(t => (t.type || 'today') === 'today');
  if (!todayItems.length) {
    showToast('오늘 미완료 항목이 없습니다');
    return;
  }
  // 사용자 의도: "하루 마감/회고" → 시계상 어제로 기록
  //  - 23:30 누름 → 시계상 어제
  //  - 02:00 누름 → 시계상 어제 (방금 끝난 활동일과 일치)
  //  - 09:00 누름 → 시계상 어제 (어제 활동일 정리)
  const recordDateStr = yesterdayStr();

  if (!confirm(todayItems.length + '개의 미완료 항목을 ' + recordDateStr + ' 미완료로 기록하고 오늘 목록을 비웁니다. 계속할까요?')) return;

  const completed_at = nowISO();
  todayItems.forEach(t => {
    state.completed.push({
      id: t.id, user: t.user, text: t.text,
      completed_date: recordDateStr, completed_at,
      created_at: t.created_at, status: 'missed'
    });
    queue.push('completeTodo', {
      id: t.id, completed_at, completed_date: recordDateStr, status: 'missed'
    });
  });
  state.todos = state.todos.filter(t => (t.type || 'today') !== 'today');

  renderAll();
  showToast(todayItems.length + '개 항목 → ' + recordDateStr + ' 미완료 처리됨');
}

function moveTodo(id, targetType) {
  if (!guard()) return;
  const t = state.todos.find(x => x.id === id);
  if (!t) return;
  t.type = targetType;
  t.order = maxOrderOf(targetType) + 1;
  renderTodos();
  saveCurrentToCache();
  queue.push('moveTodo', { id, type: targetType });
}

function addShortcutPrompt() {
  if (!guard()) return;
  const text = (prompt('단축어 텍스트') || '').trim();
  if (!text) return;
  const id = newId();
  const created_at = nowISO();
  state.shortcuts.push({ id, user: state.currentUser, text, created_at });
  renderShortcuts();
  saveCurrentToCache();
  queue.push('addShortcut', { id, user: state.currentUser, text, created_at });
}

function deleteShortcut(id) {
  if (!guard()) return;
  if (!confirm('이 단축어를 삭제할까요?')) return;
  state.shortcuts = state.shortcuts.filter(s => s.id !== id);
  renderShortcuts();
  saveCurrentToCache();
  queue.push('deleteShortcut', { id });
}

// ═════════════════════════════════════════════
// Drag & Drop
// ═════════════════════════════════════════════
let dragId = null, dragType = null;
function attachDrag(item, type) {
  item.addEventListener('dragstart', (e) => {
    dragId = item.dataset.id;
    dragType = type;
    item.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
  });
  item.addEventListener('dragend', () => {
    item.classList.remove('dragging');
    $$('.todo-item').forEach(n => n.classList.remove('drag-over'));
    dragId = null; dragType = null;
  });
  item.addEventListener('dragover', (e) => {
    if (!dragId || dragType !== type) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    if (item.dataset.id !== dragId) item.classList.add('drag-over');
  });
  item.addEventListener('dragleave', () => item.classList.remove('drag-over'));
  item.addEventListener('drop', (e) => {
    e.preventDefault();
    item.classList.remove('drag-over');
    if (!dragId || dragType !== type || dragId === item.dataset.id) return;
    const targetId = item.dataset.id;
    const sameType = state.todos
      .filter(t => (t.type || 'today') === type)
      .sort((a, b) => a.order - b.order);
    const ids = sameType.map(t => t.id);
    const from = ids.indexOf(dragId), to = ids.indexOf(targetId);
    if (from === -1 || to === -1) return;
    const [moved] = sameType.splice(from, 1);
    sameType.splice(to, 0, moved);
    sameType.forEach((t, i) => {
      const ref = state.todos.find(x => x.id === t.id);
      if (ref) ref.order = i + 1;
    });
    renderTodos();
    saveCurrentToCache();
    queue.push('reorderTodos', {
      user: state.currentUser,
      orderedIds: sameType.map(t => t.id)
    });
  });
}

// ═════════════════════════════════════════════
// Calendar
// ═════════════════════════════════════════════
function renderCalendar() {
  if (state.calYear == null) {
    const d = new Date();
    state.calYear = d.getFullYear();
    state.calMonth = d.getMonth();
  }
  const y = state.calYear, m = state.calMonth;
  $('#calendarTitle').textContent = y + '.' + pad2(m + 1);

  // 그날별 done/missed 집계
  const statByDate = {};
  state.completed.forEach(c => {
    const ds = c.completed_date;
    if (!statByDate[ds]) statByDate[ds] = { done: 0, missed: 0 };
    if (c.status === 'missed') statByDate[ds].missed++;
    else statByDate[ds].done++;
  });

  const grid = $('#calendarGrid');
  grid.innerHTML = '';
  ['일','월','화','수','목','금','토'].forEach((d, i) => {
    grid.appendChild(el('div', {
      class: 'cal-dow' + (i === 0 ? ' sun' : ''),
      text: d
    }));
  });

  const firstDow = new Date(y, m, 1).getDay();
  const lastDate = new Date(y, m + 1, 0).getDate();
  const today = todayStr();

  for (let i = 0; i < firstDow; i++) {
    grid.appendChild(el('div', { class: 'cal-cell empty' }));
  }
  for (let d = 1; d <= lastDate; d++) {
    const ds = y + '-' + pad2(m + 1) + '-' + pad2(d);
    const stat = statByDate[ds];
    const total = stat ? (stat.done + stat.missed) : 0;
    const rate = total > 0 ? Math.round(stat.done / total * 100) : 0;

    const classes = ['cal-cell'];
    if (ds === today) classes.push('today');
    if (ds === state.calSelected) classes.push('selected');

    let rateNode = null;
    if (total > 0) {
      let rateCls = 'cal-rate';
      if (rate >= 80) rateCls += ' high';
      else if (rate >= 50) rateCls += ' mid';
      else rateCls += ' low';
      rateNode = el('div', {
        class: rateCls,
        text: rate + '%',
        title: '완료 ' + stat.done + ' / 미완료 ' + stat.missed + ' (달성률 ' + rate + '%)'
      });
    }

    const cell = el('div', {
      class: classes.join(' '),
      dataset: { date: ds },
      onclick: () => selectDay(ds)
    },
      el('div', { class: 'cal-date', text: String(d) }),
      rateNode
    );
    grid.appendChild(cell);
  }
}

function selectDay(ds) {
  state.calSelected = ds;
  renderCalendar();
  const items = state.completed
    .filter(c => c.completed_date === ds)
    .sort((a, b) => {
      // done 먼저, missed 뒤
      const sa = a.status === 'missed' ? 1 : 0;
      const sb = b.status === 'missed' ? 1 : 0;
      if (sa !== sb) return sa - sb;
      return String(a.completed_at).localeCompare(String(b.completed_at));
    });

  const doneCount = items.filter(c => c.status !== 'missed').length;
  const missedCount = items.filter(c => c.status === 'missed').length;
  const totalCount = doneCount + missedCount;
  const rate = totalCount > 0 ? Math.round(doneCount / totalCount * 100) : 0;

  const detail = $('#dayDetail');
  detail.innerHTML = '';
  const titleChildren = [
    document.createTextNode('기록 · '),
    el('strong', { text: ds }),
    document.createTextNode(' · 완료 ' + doneCount + '건')
  ];
  if (missedCount > 0) {
    titleChildren.push(document.createTextNode(' · 미완료 ' + missedCount + '건'));
  }
  if (totalCount > 0) {
    titleChildren.push(document.createTextNode(' · 달성률 ' + rate + '%'));
  }
  detail.appendChild(el('div', { class: 'day-detail-title' }, titleChildren));

  if (!items.length) {
    detail.appendChild(el('div', { class: 'empty', text: '— 이날은 기록이 없습니다 —' }));
    return;
  }
  const list = el('div', { class: 'day-detail-list' });
  items.forEach(it => {
    const cls = 'day-detail-item' + (it.status === 'missed' ? ' missed' : '');
    list.appendChild(el('div', { class: cls, text: it.text }));
  });
  detail.appendChild(list);
}

// ═════════════════════════════════════════════
// Stats
// ═════════════════════════════════════════════
function getPeriodRange() {
  const now = new Date();
  let start, end, bucketType;
  if (state.period === 'week') {
    const day = now.getDay();
    const diffToMon = (day === 0 ? -6 : 1 - day);
    start = new Date(now); start.setDate(now.getDate() + diffToMon);
    start.setHours(0,0,0,0);
    end = new Date(start); end.setDate(start.getDate() + 6);
    end.setHours(23,59,59,999);
    bucketType = 'day7';
  } else if (state.period === 'month') {
    start = new Date(now.getFullYear(), now.getMonth(), 1);
    end = new Date(now.getFullYear(), now.getMonth() + 1, 0, 23, 59, 59, 999);
    bucketType = 'dayMonth';
  } else {
    start = new Date(now.getFullYear(), 0, 1);
    end = new Date(now.getFullYear(), 11, 31, 23, 59, 59, 999);
    bucketType = 'month12';
  }
  return { start, end, bucketType };
}

function renderStats() {
  const wrap = $('#statsContent');
  const { start, end, bucketType } = getPeriodRange();
  const sTs = start.getTime(), eTs = end.getTime();

  // 'done'만 완료로 카운트 (missed는 통계에서 제외)
  const compIn = state.completed.filter(c => {
    if (c.status === 'missed') return false;
    const t = new Date(c.completed_at).getTime();
    return t >= sTs && t <= eTs;
  });

  // '추가' 카운트는 missed 포함해서 created_at 기준
  const allCreated = state.todos
    .map(t => ({ created_at: t.created_at }))
    .concat(state.completed.map(c => ({ created_at: c.created_at })));
  const createdIn = allCreated.filter(x => {
    const t = new Date(x.created_at).getTime();
    return t >= sTs && t <= eTs;
  });

  const completedCount = compIn.length;
  const createdCount = createdIn.length;
  const rate = createdCount === 0 ? 0 : Math.round(completedCount / createdCount * 100);

  const counter = {};
  compIn.forEach(c => { counter[c.text] = (counter[c.text] || 0) + 1; });
  const top = Object.entries(counter).sort((a, b) => b[1] - a[1]).slice(0, 5);

  const buckets = buildBuckets(bucketType, start, end, compIn, createdIn);

  wrap.innerHTML = '';

  const grid = el('div', { class: 'stats-grid' },
    el('div', { class: 'stat-card accent' },
      el('div', { class: 'stat-card-label', text: '완료' }),
      el('div', { class: 'stat-card-value' },
        el('span', { class: 'mono', text: String(completedCount) }),
        el('span', { class: 'unit', text: '건' })
      )
    ),
    el('div', { class: 'stat-card' },
      el('div', { class: 'stat-card-label', text: '추가' }),
      el('div', { class: 'stat-card-value' },
        el('span', { class: 'mono', text: String(createdCount) }),
        el('span', { class: 'unit', text: '건' })
      )
    ),
    el('div', { class: 'stat-card' },
      el('div', { class: 'stat-card-label', text: '달성률' }),
      el('div', { class: 'stat-card-value' },
        el('span', { class: 'mono', text: String(rate) }),
        el('span', { class: 'unit', text: '%' })
      )
    )
  );
  wrap.appendChild(grid);

  const chartSec = el('div', { class: 'stats-section' },
    el('div', { class: 'stats-section-title', text: '완료 추이 & 달성률' })
  );
  chartSec.appendChild(renderComboChart(buckets));
  wrap.appendChild(chartSec);

  const topSec = el('div', { class: 'stats-section' },
    el('div', { class: 'stats-section-title', text: '많이 완료한 항목 TOP 5' })
  );
  if (!top.length) {
    topSec.appendChild(el('div', { class: 'empty', text: '— 데이터 없음 —' }));
  } else {
    const list = el('div', { class: 'top-list' });
    top.forEach((entry, i) => {
      const text = entry[0], count = entry[1];
      list.appendChild(el('div', { class: 'top-item' },
        el('span', { class: 'top-rank mono', text: pad2(i + 1) }),
        el('span', { class: 'top-text', text }),
        el('span', { class: 'top-count' },
          el('strong', { text: String(count) }),
          document.createTextNode(' 회')
        )
      ));
    });
    topSec.appendChild(list);
  }
  wrap.appendChild(topSec);
}

function renderComboChart(buckets) {
  const N = buckets.length;
  const maxDone = Math.max(1, ...buckets.map(b => b.done));

  const chart = el('div', { class: 'bar-chart' });
  const plot = el('div', { class: 'chart-plot' });

  // 툴팁 (한 차트에 하나, 막대 hover/click 시 위치/내용 변경)
  const tooltip = el('div', { class: 'chart-tooltip' });

  function showTooltip(b, colEl) {
    const undone = Math.max(0, (b.created || 0) - b.done);
    const rateCls = b.rate >= 80 ? 'rate-high' : (b.rate < 50 ? 'rate-low' : '');

    tooltip.innerHTML = '';
    tooltip.appendChild(el('div', { class: 'chart-tooltip-label', text: b.label || String(b.key) }));
    tooltip.appendChild(el('div', { class: 'chart-tooltip-row' },
      el('span', { text: '완료' }),
      el('span', { class: 'v', text: b.done + '건' })
    ));
    tooltip.appendChild(el('div', { class: 'chart-tooltip-row' },
      el('span', { text: '미완료' }),
      el('span', { class: 'v', text: undone + '건' })
    ));
    tooltip.appendChild(el('div', { class: 'chart-tooltip-row' },
      el('span', { text: '달성률' }),
      el('span', { class: 'v ' + rateCls, text: ((b.created || 0) > 0 ? b.rate + '%' : '—') })
    ));

    // 활성 표시
    plot.querySelectorAll('.bar-col.active').forEach(e => e.classList.remove('active'));
    colEl.classList.add('active');

    // 위치 계산: 막대 중심 x
    const plotRect = plot.getBoundingClientRect();
    const colRect = colEl.getBoundingClientRect();
    let x = colRect.left - plotRect.left + colRect.width / 2;

    tooltip.style.display = 'block';
    tooltip.style.left = x + 'px';
    tooltip.style.top = '0px'; // plot 상단 기준 위로 솟음

    // 좌우 가장자리 보정
    const tipRect = tooltip.getBoundingClientRect();
    const halfW = tipRect.width / 2;
    if (x - halfW < 4) x = halfW + 4;
    if (x + halfW > plotRect.width - 4) x = plotRect.width - halfW - 4;
    tooltip.style.left = x + 'px';
  }

  function hideTooltip() {
    tooltip.style.display = 'none';
    plot.querySelectorAll('.bar-col.active').forEach(e => e.classList.remove('active'));
  }

  // 막대
  const barsRow = el('div', { class: 'chart-bars' });
  buckets.forEach(b => {
    const h = (b.done / maxDone) * 100;
    const col = el('div', { class: 'bar-col' },
      el('div', { class: 'bar', style: 'height:' + h + '%' },
        b.done > 0 ? el('span', { class: 'bar-val', text: String(b.done) }) : null
      )
    );
    col.addEventListener('mouseenter', () => showTooltip(b, col));
    col.addEventListener('mouseleave', hideTooltip);
    col.addEventListener('click', (e) => {
      e.stopPropagation();
      // 모바일 탭: 같은 막대 다시 누르면 닫기
      if (col.classList.contains('active') && tooltip.style.display === 'block') {
        hideTooltip();
      } else {
        showTooltip(b, col);
      }
    });
    barsRow.appendChild(col);
  });
  plot.appendChild(barsRow);

  // plot 빈 영역 클릭 → 툴팁 닫기 (외부 리스너 leak 없이)
  plot.addEventListener('click', hideTooltip);

  // 꺾은선 SVG — created>0 인 구간만 연결, 끊긴 구간은 별도 segment
  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('class', 'line-svg');
  svg.setAttribute('viewBox', '0 0 ' + N + ' 100');
  svg.setAttribute('preserveAspectRatio', 'none');

  const segments = [];
  let seg = [];
  buckets.forEach((b, i) => {
    if (b.created > 0) {
      seg.push((i + 0.5) + ',' + (100 - b.rate));
    } else if (seg.length) {
      segments.push(seg); seg = [];
    }
  });
  if (seg.length) segments.push(seg);
  segments.forEach(pts => {
    const poly = document.createElementNS(svgNS, 'polyline');
    poly.setAttribute('points', pts.join(' '));
    svg.appendChild(poly);
  });
  plot.appendChild(svg);

  // 점 (div로 그려서 viewBox 비율 왜곡 회피)
  const dotsLayer = el('div', { class: 'dots-layer' });
  buckets.forEach((b, i) => {
    if (b.created <= 0) return;
    const left = ((i + 0.5) / N) * 100;
    const top = 100 - b.rate;
    const dot = el('div', {
      class: 'dot',
      style: 'left:' + left + '%; top:' + top + '%',
      title: '달성률 ' + b.rate + '% (' + b.done + '/' + b.created + ')'
    });
    dotsLayer.appendChild(dot);
  });
  plot.appendChild(dotsLayer);

  // 툴팁 (가장 위, z-index)
  plot.appendChild(tooltip);

  chart.appendChild(plot);

  // x축 라벨
  const xLabels = el('div', { class: 'chart-x-labels' });
  buckets.forEach(b => xLabels.appendChild(el('div', { text: b.label })));
  chart.appendChild(xLabels);

  // 범례
  const legend = el('div', { class: 'chart-legend' },
    el('span', null,
      el('i', { class: 'bar-swatch' }),
      document.createTextNode('완료 건수')
    ),
    el('span', null,
      el('i', { class: 'line-swatch' }),
      document.createTextNode('달성률')
    )
  );
  chart.appendChild(legend);

  return chart;
}

function buildBuckets(bucketType, start, end, compIn, createdIn) {
  const buckets = [];
  if (bucketType === 'day7') {
    for (let i = 0; i < 7; i++) {
      const d = new Date(start);
      d.setDate(start.getDate() + i);
      const ds = d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
      const label = ['일','월','화','수','목','금','토'][d.getDay()];
      buckets.push({ key: ds, label, done: 0, created: 0, rate: 0 });
    }
    compIn.forEach(c => {
      const b = buckets.find(x => x.key === c.completed_date);
      if (b) b.done++;
    });
    createdIn.forEach(x => {
      const cd = new Date(x.created_at);
      const ds = cd.getFullYear() + '-' + pad2(cd.getMonth()+1) + '-' + pad2(cd.getDate());
      const b = buckets.find(z => z.key === ds);
      if (b) b.created++;
    });
  } else if (bucketType === 'dayMonth') {
    const last = end.getDate();
    for (let i = 1; i <= last; i++) {
      const ds = start.getFullYear() + '-' + pad2(start.getMonth()+1) + '-' + pad2(i);
      const showLabel = (i === 1 || i % 5 === 0 || i === last) ? String(i) : '';
      buckets.push({ key: ds, label: showLabel, done: 0, created: 0, rate: 0 });
    }
    compIn.forEach(c => {
      const b = buckets.find(x => x.key === c.completed_date);
      if (b) b.done++;
    });
    createdIn.forEach(x => {
      const cd = new Date(x.created_at);
      const ds = cd.getFullYear() + '-' + pad2(cd.getMonth()+1) + '-' + pad2(cd.getDate());
      const b = buckets.find(z => z.key === ds);
      if (b) b.created++;
    });
  } else {
    for (let i = 0; i < 12; i++) {
      buckets.push({ key: i, label: pad2(i+1), done: 0, created: 0, rate: 0 });
    }
    compIn.forEach(c => {
      const month = new Date(c.completed_at).getMonth();
      buckets[month].done++;
    });
    createdIn.forEach(x => {
      const month = new Date(x.created_at).getMonth();
      buckets[month].created++;
    });
  }
  buckets.forEach(b => {
    b.rate = b.created > 0 ? Math.round(b.done / b.created * 100) : 0;
    b.value = b.done; // 기존 호환
  });
  return buckets;
}

// ═════════════════════════════════════════════
// Auth: silent refresh (토큰 만료 전 자동 재발급)
// ─────────────────────────────────────────────
// Google ID Token 은 발급 시점부터 1시간 후 만료(Google 강제).
// auto_select: true 설정 덕분에 prompt() 호출 시
// 사용자가 Google 에 로그인된 상태면 UI 없이 새 토큰을 받아옴.
// → 만료 5분 전부터 미리 갱신해서 사실상 끊김 없는 세션 유지.
// ═════════════════════════════════════════════
let _refreshInFlight = false;

function refreshTokenIfNeeded(force) {
  if (_refreshInFlight) return;
  if (!auth.idToken) return;
  const msLeft = auth.exp * 1000 - Date.now();
  // 만료 5분 전부터 갱신, 또는 force=true
  if (!force && msLeft > 5 * 60 * 1000) return;
  if (!window.google || !google.accounts || !google.accounts.id) return;

  _refreshInFlight = true;
  try {
    // initGIS()가 안 됐다면 한 번 더 (안전장치)
    initGIS();
    // auto_select: true 덕분에 사용자 인터랙션 없이 새 credential 발급 시도
    google.accounts.id.prompt();
  } catch (e) {
    console.warn('[auth refresh] prompt failed', e);
  }
  // 30초 락 (콜백 후 자동 풀림)
  setTimeout(() => { _refreshInFlight = false; }, 30000);
}

// 새 토큰을 받으면 락 즉시 해제
const _origHandleCred = window.handleCredentialResponse;
window.handleCredentialResponse = function(response) {
  _refreshInFlight = false;
  _origHandleCred(response);
};

// 1분마다 토큰 상태 체크
setInterval(() => {
  if (!auth.idToken) return;

  // 만료 임박 → silent refresh
  refreshTokenIfNeeded();

  // 그래도 만료됐다면 (refresh 실패 케이스)
  if (Date.now() >= auth.exp * 1000) {
    auth.clear();
    renderAuthArea();
    renderUserTabs();
    renderRoBanner();
    renderAll();
    showToast('세션이 만료되었습니다. 다시 로그인해 주세요.', true);
    if (window.google && google.accounts && google.accounts.id) {
      google.accounts.id.prompt();
    }
  }
}, 60 * 1000);

// ═════════════════════════════════════════════
// Events
// ═════════════════════════════════════════════
$('#addTodoBtn').addEventListener('click', addTodoFromInput);
$('#todoInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') addTodoFromInput();
});
$('#addBacklogBtn').addEventListener('click', addBacklogFromInput);
$('#backlogInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') addBacklogFromInput();
});
$('#resetDayBtn').addEventListener('click', resetDay);
$('#copyTodayBtn').addEventListener('click', copyToday);

// 활동일 변경 자동 감지
//  - 새벽 6시 정각에 서버 트리거가 todos를 missed 처리하므로
//    페이지가 켜져 있을 때 클라이언트 상태가 stale 해질 수 있음.
//  - 1분마다 활동일이 바뀌었는지 체크 → 바뀌면 데이터 새로고침.
let _lastActiveDay = activeDayStr();
setInterval(() => {
  const now = activeDayStr();
  if (now !== _lastActiveDay) {
    _lastActiveDay = now;
    if (state.currentUser && auth.isValid()) {
      console.log('[activeDay] changed → reload', now);
      loadUserAll();
    }
  }
}, 60 * 1000);

// 탭 다시 활성화 시에도 한 번 체크
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  // 1) 토큰 만료 임박이면 즉시 갱신 시도
  refreshTokenIfNeeded();
  // 2) 활동일 변경 체크
  const now = activeDayStr();
  if (now !== _lastActiveDay) {
    _lastActiveDay = now;
    if (state.currentUser && auth.isValid()) loadUserAll();
  }
});

$$('.view-tab').forEach(b => {
  b.addEventListener('click', () => {
    state.view = b.dataset.view;
    $$('.view-tab').forEach(x => x.classList.toggle('active', x === b));
    $$('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + state.view));
  });
});

$$('.period-tab').forEach(b => {
  b.addEventListener('click', () => {
    state.period = b.dataset.period;
    $$('.period-tab').forEach(x => x.classList.toggle('active', x === b));
    renderStats();
  });
});

$('#prevMonth').addEventListener('click', () => {
  state.calMonth--;
  if (state.calMonth < 0) { state.calMonth = 11; state.calYear--; }
  renderCalendar();
});
$('#nextMonth').addEventListener('click', () => {
  state.calMonth++;
  if (state.calMonth > 11) { state.calMonth = 0; state.calYear++; }
  renderCalendar();
});

window.addEventListener('beforeunload', () => queue.beacon());
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') queue.beacon();
});

// GIS 라이브러리 로드 polling (async script)
let gisPoll = setInterval(() => {
  if (window.google && google.accounts && google.accounts.id) {
    clearInterval(gisPoll);
    if (initGIS() && !auth.isValid()) {
      // 저장된 세션 없고 GIS 준비됨 → 자동 prompt
      google.accounts.id.prompt();
    }
  }
}, 200);
setTimeout(() => clearInterval(gisPoll), 10000);

// 시작
boot();
</script>
</body>
</html>
